name: keep-awake
on:
  push:
    paths:
      - 'native/awake/**'
      - 'scripts/build-awake-helper.mjs'
      - '.github/workflows/awake-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-awake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: swift test --package-path native/awake
      - run: node scripts/build-awake-helper.mjs
